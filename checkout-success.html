<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تم الاشتراك — ناصر الودعاني</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#131313;
  --char:#2d2b28;
  --sand:#cec8ae;
  --warm:#9b978d;
  --sand-dim:rgba(206,200,174,.16);
  --cta:#0F7A55;
  --cta-hi:#0C6547;
  --f:'Vazirmatn',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--f);background:var(--ink);color:var(--sand);line-height:1.8;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;-webkit-font-smoothing:antialiased}
.card{max-width:460px;text-align:center;background:var(--char);border:1px solid var(--sand-dim);border-radius:10px;padding:44px 30px}
.check{width:56px;height:56px;border-radius:50%;background:var(--cta);display:flex;align-items:center;justify-content:center;margin:0 auto 22px}
.check svg{width:28px;height:28px}
h1{font-size:24px;font-weight:800;margin-bottom:12px}
p{color:var(--warm);font-size:15px;margin-bottom:8px}
.btn{display:inline-block;font-family:var(--f);font-weight:600;font-size:15.5px;padding:14px 30px;border-radius:3px;text-decoration:none;background:var(--cta);color:#fff;margin-top:24px;transition:background .16s,transform .16s}
.btn:hover{background:var(--cta-hi);transform:translateY(-2px)}
.sub{margin-top:14px;font-size:13px}
.sub a{color:var(--sand);opacity:.75}
</style>
</head>
<body>
  <div class="card">
    <div class="check" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
    </div>
    <h1>تم الاشتراك بنجاح</h1>
    <p>وصلنا طلبك. الخطوة الأخيرة قبل ما نبدأ: عبّي استمارة التدريب حتى أقدر أبني برنامجك.</p>
    <a class="btn" href="https://form.jotform.com/Alwadani/nasserpt" target="_blank" rel="noopener">تعبئة استمارة التدريب</a>
    <p class="sub"><a href="index.html">الرجوع للصفحة الرئيسية</a></p>
  </div>
</body>
</html>
